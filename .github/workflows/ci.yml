name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Run backend tests (Jest + Supertest)
        run: |
          cd backend
          npm test

      - name: Run mutation tests (Stryker)
        run: |
          cd backend
          npm run mutate

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Lint frontend (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Run frontend tests (Vitest)
        run: |
          cd frontend
          npm test

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      # ── Code Style ───────────────────────────────────────────────────────────
      - name: Check code formatting (Prettier)
        run: |
          cd backend && npx prettier --check "**/*.{js,json}" --ignore-path ../.prettierignore
          cd ../frontend && npx prettier --check "src/**/*.{js,jsx,css}"
